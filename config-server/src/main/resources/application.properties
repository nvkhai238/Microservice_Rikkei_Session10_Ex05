spring.application.name=config-server
server.port=${CONFIG_SERVER_PORT:8888}
spring.cloud.config.server.git.uri=${CONFIG_REPO_URI:file:..}
spring.cloud.config.server.git.search-paths=pharmacy-config-repo
spring.cloud.config.server.git.default-label=${CONFIG_REPO_BRANCH:main}
spring.cloud.config.server.git.clone-on-start=true
management.endpoints.web.exposure.include=health,info
